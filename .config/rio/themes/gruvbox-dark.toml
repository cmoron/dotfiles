# Gruvbox Dark (medium) — palette officielle morhetz/gruvbox
# https://github.com/morhetz/gruvbox

[colors]
background = '#282828'
foreground = '#ebdbb2'

cursor    = '#ebdbb2'
vi-cursor = '#fe8019'

selection-background = '#504945'
selection-foreground = '#ebdbb2'

# Barre d'onglets / splits
bar         = '#1d2021'
tabs        = '#3c3836'
tabs-active = '#fe8019'
split       = '#504945'

# Couleurs normales (0-7)
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Couleurs claires / bright (8-15)
light-black   = '#928374'
light-red     = '#fb4934'
light-green   = '#b8bb26'
light-yellow  = '#fabd2f'
light-blue    = '#83a598'
light-magenta = '#d3869b'
light-cyan    = '#8ec07c'
light-white   = '#ebdbb2'

# Couleurs dim
dim-black   = '#1d2021'
dim-red     = '#cc241d'
dim-green   = '#98971a'
dim-yellow  = '#d79921'
dim-blue    = '#458588'
dim-magenta = '#b16286'
dim-cyan    = '#689d6a'
dim-white   = '#a89984'
