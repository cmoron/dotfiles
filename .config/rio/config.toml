# See the full configuration reference: https://rioterm.com/docs/config

# Thème Gruvbox Dark — défini dans ~/.config/rio/themes/gruvbox-dark.toml
theme = "gruvbox-dark"

# Forcer bash dans Rio (macOS détecte mal le shell au lancement GUI).
# Reste scoped à Rio : ne touche pas au shell de login global.
[shell]
program = "/opt/homebrew/bin/bash"
args = ["--login"]

# Raccourcis type Ghostty : Command + rangée des chiffres -> bascule d'onglet.
# Layout AZERTY (PC) : la rangée du haut produit & é " ' ( - è _ ç SANS Shift.
# Rio matche le caractère LOGIQUE avec modificateurs EXACTS, donc on bind ces
# caractères réels (et non "1".."9", qui exigeraient Shift sur AZERTY).
[bindings]
keys = [
  { key = "&", with = "super", action = "SelectTab(0)" },  # Cmd + touche 1
  { key = "é", with = "super", action = "SelectTab(1)" },  # Cmd + touche 2
  { key = '"', with = "super", action = "SelectTab(2)" },  # Cmd + touche 3
  { key = "'", with = "super", action = "SelectTab(3)" },  # Cmd + touche 4
  { key = "(", with = "super", action = "SelectTab(4)" },  # Cmd + touche 5
  { key = "-", with = "super", action = "SelectTab(5)" },  # Cmd + touche 6
  { key = "è", with = "super", action = "SelectTab(6)" },  # Cmd + touche 7
  { key = "_", with = "super", action = "SelectTab(7)" },  # Cmd + touche 8
  { key = "ç", with = "super", action = "SelectLastTab" }, # Cmd + touche 9 -> dernier
]
