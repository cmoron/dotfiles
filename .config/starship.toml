# Starship prompt — config légère, sans glyphs Nerd Font requis.
# Doc : https://starship.rs/config

# Format en deux lignes : contexte + caractère d'invite.
# Ligne 1 : user (si root/ssh) · cwd · git branch+status · langage actif · durée
# Ligne 2 : ❯ (vert si succès, rouge si erreur précédente)

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$rust\
$nodejs\
$bun\
$golang\
$package\
$cmd_duration
$character"""

# Right prompt : timestamp + jobs
right_format = """$jobs$time"""

add_newline = true                   # ligne vide avant chaque prompt
scan_timeout = 30
command_timeout = 1000
palette = "cyril"

[palettes.cyril]
# Palette sobre, lisible en clair & sombre (ANSI 256)
fg          = "#d4d4d4"
muted       = "#7d7d7d"
accent      = "#7aa2f7"   # bleu
ok          = "#9ece6a"   # vert
warn        = "#e0af68"   # jaune
err         = "#f7768e"   # rouge
purple      = "#bb9af7"
cyan        = "#7dcfff"

# ── Caractère d'invite (vert ok, rouge ko) ──
[character]
success_symbol = "[❯](bold ok)"
error_symbol   = "[❯](bold err)"
vimcmd_symbol  = "[❮](bold accent)"

# ── User (visible seulement si root ou ssh) ──
[username]
style_user      = "muted"
style_root      = "bold err"
format          = "[$user]($style)@"
disabled        = false
show_always     = false

# ── Host (visible seulement si SSH) ──
[hostname]
ssh_only        = true
format          = "[$hostname](muted) "
trim_at         = "."
disabled        = false

# ── Directory ──
[directory]
truncation_length = 4
truncate_to_repo  = false
read_only         = "ro"
read_only_style   = "warn"
style             = "bold accent"
format            = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/conf/dotfiles" = "~dot"
"~/.claude"       = "~claude"
"~/src"           = "~src"

# ── Git ──
[git_branch]
symbol          = ""
format          = "[$symbol$branch(:$remote_branch)](purple) "
truncation_length = 30

[git_status]
style           = "bold warn"
format          = "[$all_status$ahead_behind]($style) "
conflicted      = "≠"
ahead           = "↑${count}"
behind          = "↓${count}"
diverged        = "↕↑${ahead_count}↓${behind_count}"
up_to_date      = ""
untracked       = "?"
stashed         = "*"
modified        = "!"
staged          = "+${count}"
renamed         = "»"
deleted         = "x"

[git_state]
format          = "[\\($state( $progress_current of $progress_total)\\)](err) "
cherry_pick     = "cherry"
rebase          = "rebase"
merge           = "merge"
revert          = "revert"
bisect          = "bisect"
am              = "am"
am_or_rebase    = "am/rebase"

# ── Languages ──
[python]
symbol          = "py "
format          = "[\\($symbol$version$virtualenv\\)](cyan) "
detect_extensions = ["py", "ipynb"]
detect_files    = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "uv.lock"]

[rust]
symbol          = "rs "
format          = "[\\($symbol$version\\)](warn) "

[nodejs]
symbol          = "node "
format          = "[\\($symbol$version\\)](ok) "
detect_files    = ["package.json", ".nvmrc"]
not_capable_style = "muted"

[bun]
symbol          = "bun "
format          = "[\\($symbol$version\\)](purple) "
detect_files    = ["bun.lockb", "bunfig.toml"]

[golang]
symbol          = "go "
format          = "[\\($symbol$version\\)](cyan) "

[package]
symbol          = "pkg "
disabled        = true

# ── Cmd duration ──
[cmd_duration]
min_time        = 2_000     # affiché si > 2s
format          = "[took $duration](muted) "
show_milliseconds = false

# ── Time (right prompt) ──
[time]
disabled        = false
format          = "[$time](muted)"
time_format     = "%H:%M:%S"
use_12hr        = false

# ── Jobs (right prompt) ──
[jobs]
symbol          = "⚙ "
threshold       = 1
format          = "[$symbol$number](warn) "

# ── Misc cleanup ──
[line_break]
disabled        = false

[aws]
disabled        = true

[gcloud]
disabled        = true

[kubernetes]
disabled        = true
