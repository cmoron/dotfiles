# Starship prompt — clone visuel du PS1 bash Arch :
#   user@host ~/path (branch) $
# User rouge (bleu si root), host blanc, path jaune, branche/status blanc, $ blanc.
# Bonus par rapport au PS1 bash : durée si >2s, time à droite, statut git détaillé.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$rust\
$nodejs\
$bun\
$golang\
$package\
$cmd_duration\
$character"""

right_format = """$jobs$time"""

add_newline = false                  # pas de ligne vide avant le prompt
scan_timeout = 30
command_timeout = 1000
palette = "cyril"

[palettes.cyril]
red    = "#ff6b6b"   # user
blue   = "#7aa2f7"   # root
white  = "#d4d4d4"   # @, host, branche, $
yellow = "#e0af68"   # cwd
muted  = "#7d7d7d"   # cmd_duration, time
ok     = "#9ece6a"
err    = "#f7768e"
purple = "#bb9af7"
cyan   = "#7dcfff"

# ── $ d'invite (blanc OK, rouge si dernière commande KO).
# Espace inclus dans le symbole pour garantir un séparateur même si tous les
# modules précédents (git, langage, cmd_duration) sont absents.
[character]
success_symbol = "[ \\$](white)"
error_symbol   = "[ \\$](bold err)"
vimcmd_symbol  = "[ <](bold blue)"

# ── User : toujours visible (rouge non-root, bleu root) ──
[username]
style_user  = "bold red"
style_root  = "bold blue"
format      = "[$user]($style)"
show_always = true
disabled    = false

# ── Host : toujours visible (clone bash) ──
[hostname]
ssh_only = false
format   = "[@$hostname](white) "
trim_at  = "."
disabled = false

# ── Directory : full path façon \w (pas de troncature) ──
[directory]
truncation_length  = 100             # pratiquement pas de troncature
truncate_to_repo   = false
read_only          = " ro"
read_only_style    = "err"
style              = "yellow"
format             = "[$path]($style)[$read_only]($read_only_style)"

# ── Git branch : `(branch)` en blanc, façon __git_ps1 ──
[git_branch]
symbol            = ""
format            = " [\\($branch\\)](white)"
truncation_length = 30

# ── Git status : indicateurs compacts collés après la branche ──
[git_status]
style      = "white"
format     = "[$all_status$ahead_behind]($style)"
conflicted = " ≠"
ahead      = " ↑${count}"
behind     = " ↓${count}"
diverged   = " ↕↑${ahead_count}↓${behind_count}"
up_to_date = ""
untracked  = " ?"
stashed    = " *"
modified   = " !"
staged     = " +${count}"
renamed    = " »"
deleted    = " x"

[git_state]
format       = " [\\($state( $progress_current of $progress_total)\\)](err)"
cherry_pick  = "cherry"
rebase       = "rebase"
merge        = "merge"
revert       = "revert"
bisect       = "bisect"
am           = "am"
am_or_rebase = "am/rebase"

# ── Languages (collés après git, avant la durée) ──
[python]
symbol          = "py "
format          = " [\\($symbol$version$virtualenv\\)](cyan)"
detect_extensions = ["py", "ipynb"]
detect_files    = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "uv.lock"]

[rust]
symbol = "rs "
format = " [\\($symbol$version\\)](yellow)"

[nodejs]
symbol            = "node "
format            = " [\\($symbol$version\\)](ok)"
detect_files      = ["package.json", ".nvmrc"]
not_capable_style = "muted"

[bun]
symbol       = "bun "
format       = " [\\($symbol$version\\)](purple)"
detect_files = ["bun.lockb", "bunfig.toml"]

[golang]
symbol = "go "
format = " [\\($symbol$version\\)](cyan)"

[package]
disabled = true

# ── Cmd duration ──
[cmd_duration]
min_time          = 2_000
format            = " [took $duration](muted)"
show_milliseconds = false

# ── Right prompt : timestamp + jobs ──
[time]
disabled    = false
format      = "[$time](muted)"
time_format = "%H:%M:%S"
use_12hr    = false

[jobs]
symbol    = "⚙ "
threshold = 1
format    = "[$symbol$number](err) "

# ── Espace avant le $ ──
# Les modules ci-dessus se terminent sans espace → on en injecte un avant $character.
[line_break]
disabled = false

[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true
