# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
# Avoid Escape lag in Vim while allowing a short delay for Alt/key sequences.
set -s escape-time 10

# Terminal title
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Panes
set -g mouse on
# Alt+h/j/k/l (Cmd sur macOS via Rio/Ghostty) : navigation sans préfixe.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Also accept older Rio configurations that send the prefix before h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Splits sur les touches tmux par defaut ; d reste le detach standard.
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind x kill-pane
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Copy mode: Vim keys and the terminal's system clipboard (OSC 52).
setw -g mode-keys vi
set -s set-clipboard external
bind -n M-i copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Match Neovim's J/K scrolling, including during selection.
bind -T copy-mode-vi J send-keys -X -N 2 scroll-down
bind -T copy-mode-vi K send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 10 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 10 scroll-down
# Keep mouse events in applications that handle them; otherwise scroll history.
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
    send-keys -M
} {
    copy-mode -e -t =
    send-keys -t = -X -N 10 scroll-up
}

# Gruvbox status line
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1d2021,fg=#ebdbb2'
set -g status-left-length 40
set -g status-left '#[bg=#458588,fg=#1d2021,bold] #S #[bg=#1d2021]#{?client_prefix,#[bg=#cc241d,fg=#ebdbb2,bold] PREFIX #[bg=#1d2021],} '
set -g window-status-separator ' '
set -g window-status-format '#[bg=#3c3836,fg=#bdae93] #I:#W#F #[bg=#1d2021]'
set -g window-status-current-format '#[bg=#d65d0e,fg=#1d2021,bold] #I:#W#F #[bg=#1d2021]'
set -g status-right-length 30
set -g status-right '#[bg=#3c3836,fg=#bdae93] %d/%m #[bg=#458588,fg=#1d2021,bold] %H:%M '
