# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Terminal title
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Panes
set -g mouse on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind d split-window -h -c '#{pane_current_path}'
bind D split-window -v -c '#{pane_current_path}'
bind x kill-pane
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Gruvbox status line
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1d2021,fg=#ebdbb2'
set -g status-left-length 40
set -g status-left '#[bg=#458588,fg=#1d2021,bold] #S #[bg=#1d2021]#{?client_prefix,#[bg=#cc241d,fg=#ebdbb2,bold] PREFIX #[bg=#1d2021],} '
set -g window-status-separator ' '
set -g window-status-format '#[bg=#3c3836,fg=#bdae93] #I:#W#F #[bg=#1d2021]'
set -g window-status-current-format '#[bg=#d65d0e,fg=#1d2021,bold] #I:#W#F #[bg=#1d2021]'
set -g status-right-length 30
set -g status-right '#[bg=#3c3836,fg=#bdae93] %d/%m #[bg=#458588,fg=#1d2021,bold] %H:%M '
